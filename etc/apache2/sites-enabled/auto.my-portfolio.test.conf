<VirtualHost *:80> 
    DocumentRoot "C:/laragon/www/my-portfolio"
    ServerName my-portfolio.test
    ServerAlias *.my-portfolio.test
    <Directory "C:/laragon/www/my-portfolio">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

